name: tests

on:
  push:
    paths: ["tools/**", "tests/**", "web/**", "ci/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    # Linux runners are the cheapest; nothing here needs macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python inspector tests
        run: python -m unittest discover -s tests -v
      - name: Web inspector matches the Python inspector
        run: node tests/web_inspector.test.mjs
